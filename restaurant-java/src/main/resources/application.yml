server:
  port: 8080

spring:
  application:
    name: restaurant-java
  # MySQL 数据源：本机 MySQL 8.4 运行在 3307 端口（3306 被系统里旧版 MySQL 服务占用）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/restaurant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  # SQL 映射文件位置
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.restaurant.entity
  configuration:
    # 数据库下划线字段自动映射为 Java 驼峰属性，如 table_no → tableNo
    map-underscore-to-camel-case: true
    # 控制台打印执行的 SQL，方便调试与答辩演示
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.restaurant: info
